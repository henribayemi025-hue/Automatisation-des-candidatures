name = "automatisation-des-candidatures"
main = "src/worker.js"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* est traité par le worker (src/worker.js), tout le reste par les assets.
run_worker_first = ["/api/*"]

# Secret attendu : GEMINI_API_KEY (Settings → Variables and Secrets du worker).
# Déploiement : ce dépôt est connecté à Cloudflare, chaque poussée déploie.
# Build : npm run build — Deploy : npx wrangler deploy
